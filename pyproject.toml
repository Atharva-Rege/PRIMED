[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "primed"
version = "1.0.0"
description = "PRIMED: single-pass missing-modality MRI synthesis (WACV 2027)"
readme = "README.md"
license = "CC-BY-NC-4.0"
license-files = ["LICENSE"]
requires-python = ">=3.9"
authors = [
    { name = "Atharva Atul Rege" },
    { name = "Adinath Madhavrao Dukre" },
    { name = "Imran Razzak" },
]
dependencies = [
    "torch>=2.1",
    "monai>=1.4.0",
    "einops>=0.6",
    "nibabel>=5.0",
    "numpy>=1.23",
    "pyyaml>=6.0",
    "safetensors>=0.4",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.setuptools]
packages = ["primed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
